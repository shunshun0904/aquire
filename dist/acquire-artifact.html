<title>ACQUIRE — ホテルチェーン買収ゲーム</title>
<style>
/* ==========================================================================
   ACQUIRE — スタイル & アニメーション
   ========================================================================== */

/* --- リセット ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
button { font: inherit; color: inherit; }

:root {
  --bg-0: #0a0e18;
  --bg-1: #111827;
  --bg-2: #172033;
  --bg-3: #1e2a42;
  --line: rgba(255, 255, 255, .09);
  --line-strong: rgba(255, 255, 255, .18);
  --text: #e8edf7;
  --text-dim: #97a3bb;
  --text-faint: #5d6a84;
  --gold: #e9c46a;
  --gold-deep: #b98f2d;
  --good: #4ade80;
  --bad: #f87171;
  --radius: 14px;
  --cell-gap: 3px;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
}

body {
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(59, 125, 216, .12), transparent),
    radial-gradient(1000px 600px at 110% 10%, rgba(233, 196, 106, .07), transparent),
    radial-gradient(900px 900px at 50% 120%, rgba(23, 182, 196, .06), transparent),
    var(--bg-0);
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
               system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 背景の淡いグリッド */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 46px 46px;
  pointer-events: none;
  z-index: 0;
}

#app { position: relative; z-index: 1; max-width: 1560px; margin: 0 auto; padding: 14px clamp(10px, 2vw, 22px) 20px; }

/* --- トップバー ---------------------------------------------------------- */
.topbar {
  display: flex; align-items: center; gap: 18px;
  padding: 12px 16px; margin-bottom: 16px;
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(8px);
  animation: dropIn .6s var(--ease-out) both;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 42px; height: 42px; display: grid; place-items: center;
  border-radius: 11px; font-weight: 800; font-size: 22px; color: #1a1206;
  background: linear-gradient(145deg, #f6d98b, var(--gold-deep));
  box-shadow: 0 6px 18px rgba(233,196,106,.28), inset 0 1px 0 rgba(255,255,255,.6);
  animation: markPulse 5s ease-in-out infinite;
}
@keyframes markPulse {
  0%, 100% { box-shadow: 0 6px 18px rgba(233,196,106,.22), inset 0 1px 0 rgba(255,255,255,.6); }
  50%      { box-shadow: 0 6px 26px rgba(233,196,106,.45), inset 0 1px 0 rgba(255,255,255,.6); }
}
.brand-text h1 { margin: 0; font-size: 19px; letter-spacing: .22em; font-weight: 700; }
.brand-text p { margin: 1px 0 0; font-size: 11px; color: var(--text-faint); letter-spacing: .08em; }

.status { flex: 1; min-width: 0; text-align: center; }
.status-turn {
  font-size: 16px; font-weight: 700; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.status-phase { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.status.flash .status-turn { animation: turnFlash .8s var(--ease-out); }
@keyframes turnFlash {
  0%   { transform: translateY(8px) scale(.96); opacity: 0; filter: blur(3px); }
  60%  { transform: translateY(0) scale(1.04); opacity: 1; filter: blur(0); }
  100% { transform: none; }
}

.topbar-actions { display: flex; align-items: center; gap: 8px; }

.btn {
  border: 1px solid var(--line-strong); background: rgba(255,255,255,.06);
  color: var(--text); padding: 9px 16px; border-radius: 10px; cursor: pointer;
  font-size: 13px; font-weight: 600; letter-spacing: .02em;
  transition: transform .16s var(--ease-back), background .2s, box-shadow .2s, border-color .2s;
}
.btn:hover:not(:disabled) { background: rgba(255,255,255,.12); transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.97); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(145deg, #f3d489, var(--gold-deep));
  border-color: transparent; color: #1a1206;
  box-shadow: 0 6px 18px rgba(233,196,106,.3);
}
.btn-primary:hover:not(:disabled) { box-shadow: 0 10px 26px rgba(233,196,106,.45); }
.btn-ghost { background: transparent; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line-strong); background: rgba(255,255,255,.05);
  display: grid; place-items: center; font-size: 15px;
  transition: background .2s, transform .16s var(--ease-back);
}
.icon-btn:hover { background: rgba(255,255,255,.13); transform: translateY(-2px); }
.icon-btn[aria-pressed="false"] { opacity: .4; }

/* --- レイアウト ---------------------------------------------------------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  gap: 16px;
  align-items: start;
}
.board-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side-col { display: flex; flex-direction: column; gap: 14px; }

/* 横並びのときサイドは自前でスクロールさせ、ページ全体の高さを押し上げない */
@media (min-width: 1181px) {
  .side-col {
    position: sticky; top: 14px;
    /* ヘッダー(約82px) + 上下パディング(34px) を差し引く */
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent;
    padding-right: 2px;
  }
  .side-col::-webkit-scrollbar { width: 6px; }
  .side-col::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }
}

/* --- ボード -------------------------------------------------------------- */
.board-shell {
  position: relative;
  padding: clamp(8px, 1.4vw, 16px);
  background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  animation: dropIn .7s .05s var(--ease-out) both;
}
.board-shell.quake { animation: quake .5s ease-in-out; }
@keyframes quake {
  0%, 100% { transform: translate(0,0) rotate(0); }
  15% { transform: translate(-5px, 3px) rotate(-.3deg); }
  30% { transform: translate(5px, -3px) rotate(.3deg); }
  45% { transform: translate(-4px, -2px) rotate(-.2deg); }
  60% { transform: translate(4px, 2px) rotate(.2deg); }
  80% { transform: translate(-2px, 1px); }
}

.board-glow {
  position: absolute; inset: -1px; border-radius: 20px; pointer-events: none;
  opacity: 0; transition: opacity .5s;
  background: radial-gradient(400px 260px at var(--gx, 50%) var(--gy, 50%), var(--gc, #fff), transparent 70%);
  mix-blend-mode: screen;
}
.board-glow.on { opacity: .34; }

.board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--cell-gap);
  margin: 0 auto;
}
/* 横並びレイアウトのときは、手札と操作パネルが画面内に収まる高さに抑える。
   盤面は 12:9 なので、残り高さから逆算して幅の上限を決め、
   手札・操作パネルも同じ幅に揃えて中央に置く。 */
@media (min-width: 1181px) {
  .board-col {
    --board-w: clamp(480px, calc((100vh - 400px) * 4 / 3), 880px);
    max-width: calc(var(--board-w) + 34px);
    margin: 0 auto;
  }
  .board { max-width: var(--board-w); }
}

.cell {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(255,255,255,.028);
  display: grid; place-items: center;
  font-size: clamp(8px, .85vw, 12px);
  font-weight: 600;
  color: var(--text-faint);
  letter-spacing: .02em;
  user-select: none;
  transition: background .25s, border-color .25s, color .25s, transform .25s var(--ease-back);
  overflow: hidden;
}
.cell::after { /* 光沢 */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(150deg, rgba(255,255,255,.32), transparent 55%);
  transition: opacity .3s;
}

/* 無所属タイル */
.cell.lone {
  background: linear-gradient(150deg, #e7ebf3, #b6c0d3);
  border-color: rgba(255,255,255,.5);
  color: #2a3244;
  box-shadow: 0 3px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.8);
}
.cell.lone::after { opacity: 1; }

/* チェーン所属タイル */
.cell.chained {
  background: linear-gradient(150deg, var(--c), var(--cd));
  border-color: rgba(255,255,255,.28);
  color: rgba(255,255,255,.95);
  text-shadow: 0 1px 2px rgba(0,0,0,.5);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 45%, transparent),
              inset 0 1px 0 rgba(255,255,255,.35);
}
.cell.chained::after { opacity: .8; }
.cell.chained .tag { font-size: clamp(7px, .8vw, 11px); font-weight: 800; letter-spacing: .04em; }

/* 安全チェーンの錠マーク */
.cell.safe-mark::before {
  content: "";
  position: absolute; top: 3px; right: 3px; width: 5px; height: 5px;
  border-radius: 50%; background: rgba(255,255,255,.9);
  box-shadow: 0 0 6px rgba(255,255,255,.9);
}

/* 配置可能ハイライト */
.cell.playable {
  border-color: rgba(233,196,106,.5);
  background: rgba(233,196,106,.09);
  color: var(--gold);
  cursor: pointer;
  animation: playablePulse 2.4s ease-in-out infinite;
}
@keyframes playablePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(233,196,106,0); }
  50%      { box-shadow: 0 0 0 3px rgba(233,196,106,.16); }
}
.cell.target {
  transform: scale(1.14); z-index: 4;
  border-color: var(--gold);
  background: rgba(233,196,106,.25);
  box-shadow: 0 0 22px rgba(233,196,106,.5);
}

/* --- セルのアニメーション ------------------------------------------------ */
.cell.anim-pop { animation: cellPop .5s var(--ease-back) both; animation-delay: var(--d, 0ms); }
@keyframes cellPop {
  0%   { transform: scale(.2) rotate(-14deg); opacity: 0; }
  55%  { transform: scale(1.22) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}

.cell.anim-paint { animation: cellPaint .55s var(--ease-out) both; animation-delay: var(--d, 0ms); }
/* 1回転させて終える。180deg で止めると文字が鏡像になってしまう */
@keyframes cellPaint {
  0%   { transform: rotateY(0deg) scale(1); filter: brightness(1); }
  40%  { transform: rotateY(90deg) scale(1.18); filter: brightness(2.4); }
  70%  { transform: rotateY(240deg) scale(1.1); }
  100% { transform: rotateY(360deg) scale(1); filter: brightness(1); }
}
.cell.anim-paint { transform-style: preserve-3d; }

.cell.anim-absorb { animation: cellAbsorb .65s var(--ease-out) both; animation-delay: var(--d, 0ms); }
@keyframes cellAbsorb {
  0%   { transform: scale(1); filter: saturate(1) brightness(1); }
  25%  { transform: scale(.72) rotate(-8deg); filter: saturate(.2) brightness(.6); }
  60%  { transform: scale(1.2) rotate(5deg); filter: saturate(1.6) brightness(1.8); }
  100% { transform: scale(1); filter: none; }
}

.cell.anim-shine::after { animation: shineSweep .8s var(--ease-out) both; animation-delay: var(--d, 0ms); }
@keyframes shineSweep {
  0%   { opacity: 0; transform: translateX(-120%); }
  40%  { opacity: 1; }
  100% { opacity: .8; transform: translateX(120%); }
}

/* --- 飛ぶタイル / エフェクト層 ------------------------------------------- */
.fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.flying-tile {
  position: fixed; z-index: 200; pointer-events: none;
  border-radius: 8px; display: grid; place-items: center;
  font-weight: 700; font-size: 13px; color: #2a3244;
  background: linear-gradient(150deg, #f3f6fb, #c3ccdd);
  box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.9);
  transition: transform .52s var(--ease-out), opacity .2s .38s;
}

.ripple {
  position: absolute; border-radius: 50%; pointer-events: none;
  border: 2px solid var(--rc, #fff);
  transform: translate(-50%, -50%) scale(.2); opacity: .9;
  animation: rippleOut .9s var(--ease-out) forwards;
}
@keyframes rippleOut {
  to { transform: translate(-50%, -50%) scale(6); opacity: 0; }
}

.float-text {
  position: fixed; z-index: 250; pointer-events: none;
  font-weight: 800; font-size: 15px; letter-spacing: .02em;
  text-shadow: 0 2px 10px rgba(0,0,0,.7);
  animation: floatUp 1.35s var(--ease-out) forwards;
  white-space: nowrap;
}
.float-text.gain { color: var(--good); }
.float-text.loss { color: var(--bad); }
.float-text.gold { color: var(--gold); }
@keyframes floatUp {
  0%   { transform: translate(-50%, 0) scale(.7); opacity: 0; }
  18%  { transform: translate(-50%, -12px) scale(1.14); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translate(-50%, -62px) scale(1); opacity: 0; }
}

.flying-stock {
  position: fixed; z-index: 220; pointer-events: none;
  width: 34px; height: 44px; border-radius: 5px;
  background: linear-gradient(160deg, var(--c), var(--cd));
  border: 1px solid rgba(255,255,255,.5);
  box-shadow: 0 10px 26px rgba(0,0,0,.5);
  transition: transform .6s var(--ease-out), opacity .25s .4s;
}

/* --- 手札 ---------------------------------------------------------------- */
.hand-shell {
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px 14px;
  animation: dropIn .7s .1s var(--ease-out) both;
}
.hand-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 10px; }
.hand-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; }
.hand-hint { font-size: 11.5px; color: var(--text-dim); }
.hand { display: flex; flex-wrap: wrap; gap: 10px; min-height: 58px; }

.tile {
  position: relative;
  width: 62px; height: 54px; border-radius: 10px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.35);
  background: linear-gradient(150deg, #f2f5fa, #c0cade);
  color: #262d3d; font-weight: 800; font-size: 16px;
  display: grid; place-items: center;
  box-shadow: 0 6px 16px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.9);
  transition: transform .2s var(--ease-back), box-shadow .2s, filter .2s;
  animation: tileDeal .5s var(--ease-back) both;
  animation-delay: var(--d, 0ms);
}
@keyframes tileDeal {
  0%   { transform: translateY(40px) rotate(-12deg) scale(.6); opacity: 0; }
  100% { transform: none; opacity: 1; }
}
.tile:hover:not(:disabled):not(.dead) { transform: translateY(-8px) scale(1.05); box-shadow: 0 14px 30px rgba(0,0,0,.55); }
.tile.selected {
  transform: translateY(-12px) scale(1.08);
  border-color: var(--gold);
  box-shadow: 0 0 0 2px var(--gold), 0 16px 34px rgba(233,196,106,.4);
}
.tile.dead {
  filter: grayscale(1) brightness(.55); cursor: not-allowed;
  background: linear-gradient(150deg, #6b7385, #454c5c); color: #cfd6e4;
}
.tile.dead::after {
  content: "✕"; position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 26px; color: rgba(255,80,80,.75);
}
.tile.blocked { filter: brightness(.7) saturate(.5); cursor: not-allowed; }
.tile:disabled { cursor: default; }
.tile .kind {
  position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 20px;
  background: var(--kc, #444); color: #fff; letter-spacing: .04em;
  box-shadow: 0 2px 6px rgba(0,0,0,.4); white-space: nowrap;
}
.hand.locked .tile { cursor: default; }

/* --- アクションバー ------------------------------------------------------ */
.action-bar { min-height: 0; }
.action-card {
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  animation: slideUp .4s var(--ease-out) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
.action-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
.action-title { font-size: 14px; font-weight: 700; }
.action-sub { font-size: 12px; color: var(--text-dim); }

.buy-grid {
  display: grid; gap: 9px;
  grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
}
.buy-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 8px 8px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  transition: border-color .2s, background .2s, transform .2s var(--ease-back);
}
.buy-item.active { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); transform: translateY(-2px); }
.buy-item .swatch {
  width: 34px; height: 42px; border-radius: 6px; flex: none;
  background: linear-gradient(160deg, var(--c), var(--cd));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff;
}
.buy-item .meta { min-width: 0; flex: 1; }
.buy-item .meta b { display: block; font-size: 12px; }
.buy-item .meta span { font-size: 11px; color: var(--text-dim); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 26px; height: 26px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line-strong); background: rgba(255,255,255,.07);
  display: grid; place-items: center; font-size: 15px; line-height: 1;
  transition: background .15s, transform .15s;
}
.stepper button:hover:not(:disabled) { background: rgba(255,255,255,.16); }
.stepper button:active:not(:disabled) { transform: scale(.88); }
.stepper button:disabled { opacity: .3; cursor: not-allowed; }
.stepper .qty { width: 22px; text-align: center; font-weight: 700; font-size: 14px; }
.stepper .qty.bump { animation: qtyBump .3s var(--ease-back); }
@keyframes qtyBump { 50% { transform: scale(1.5); color: var(--gold); } }

.action-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.cart-summary { font-size: 13px; color: var(--text-dim); }
.cart-summary b { color: var(--gold); font-size: 15px; }
.action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.chain-choice { display: flex; flex-wrap: wrap; gap: 10px; }
.chain-btn {
  border: 1px solid var(--c); border-radius: 12px; cursor: pointer;
  padding: 10px 14px; min-width: 128px; text-align: left;
  background: color-mix(in srgb, var(--c) 16%, transparent);
  transition: transform .2s var(--ease-back), box-shadow .2s, background .2s;
  animation: slideUp .35s var(--ease-out) both; animation-delay: var(--d, 0ms);
}
.chain-btn:hover { transform: translateY(-4px); background: color-mix(in srgb, var(--c) 30%, transparent);
  box-shadow: 0 10px 24px color-mix(in srgb, var(--c) 35%, transparent); }
.chain-btn b { display: block; font-size: 14px; }
.chain-btn span { font-size: 11px; color: var(--text-dim); }

/* --- サイドパネル -------------------------------------------------------- */
.panel {
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 13px 14px;
  animation: dropIn .7s .15s var(--ease-out) both;
}
.panel-title {
  margin: 0 0 10px; font-size: 11px; font-weight: 700;
  letter-spacing: .18em; color: var(--text-faint); text-transform: uppercase;
}

/* プレイヤーカード */
.players { display: flex; flex-direction: column; gap: 8px; }
.pcard {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px;
  background: rgba(255,255,255,.03);
  transition: border-color .3s, background .3s, transform .3s var(--ease-back), box-shadow .3s;
}
.pcard.active {
  border-color: var(--gold);
  background: linear-gradient(120deg, rgba(233,196,106,.16), rgba(233,196,106,.03));
  box-shadow: 0 8px 24px rgba(233,196,106,.16);
  transform: translateX(3px);
}
.pcard.active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--gold); animation: barGrow .4s var(--ease-out);
}
@keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.pcard.acting { animation: actingGlow 1.6s ease-in-out infinite; }
@keyframes actingGlow {
  0%, 100% { box-shadow: 0 8px 24px rgba(233,196,106,.12); }
  50% { box-shadow: 0 8px 30px rgba(233,196,106,.35); }
}
.pcard-head { display: flex; align-items: center; gap: 8px; }
.pavatar {

<script>
/* ==========================================================================
   ACQUIRE - ルールとデータ定義
   盤面の座標、ホテルチェーン、株価表など「変わらない事実」だけを置く層。
   ========================================================================== */
(function (global) {
  'use strict';

  var AQ = (global.AQ = global.AQ || {});

  var Rules = {};

  /* --- 盤面 ------------------------------------------------------------ */
  Rules.COLS = 12;
  Rules.ROWS = 9;
  Rules.CELLS = Rules.COLS * Rules.ROWS; // 108
  Rules.ROW_LETTERS = 'ABCDEFGHI';

  /* --- ゲーム定数 ------------------------------------------------------ */
  Rules.SAFE_SIZE = 11; // これ以上は吸収されない（安全）
  Rules.END_SIZE = 41; // これ以上のチェーンが出たら終了宣言可能
  Rules.SHARES_PER_CHAIN = 25;
  Rules.START_CASH = 6000;
  Rules.HAND_SIZE = 6;
  Rules.MAX_BUY_PER_TURN = 3;

  /* --- ホテルチェーン --------------------------------------------------
     tier 0: 安価 / tier 1: 中間 / tier 2: 高価
     ---------------------------------------------------------------------- */
  Rules.CHAINS = [
    { id: 'luxor',       name: 'Luxor',       jp: 'ルクソール',       abbr: 'LX', tier: 0, color: '#e0483a', dark: '#8f231a' },
    { id: 'tower',       name: 'Tower',       jp: 'タワー',           abbr: 'TW', tier: 0, color: '#efb019', dark: '#946a05' },
    { id: 'american',    name: 'American',    jp: 'アメリカン',       abbr: 'AM', tier: 1, color: '#3b7dd8', dark: '#1d4685' },
    { id: 'festival',    name: 'Festival',    jp: 'フェスティバル',   abbr: 'FS', tier: 1, color: '#2fa464', dark: '#155f37' },
    { id: 'worldwide',   name: 'Worldwide',   jp: 'ワールドワイド',   abbr: 'WW', tier: 1, color: '#8b5cd6', dark: '#4d2c85' },
    { id: 'imperial',    name: 'Imperial',    jp: 'インペリアル',     abbr: 'IM', tier: 2, color: '#ef8022', dark: '#984a08' },
    { id: 'continental', name: 'Continental', jp: 'コンチネンタル',   abbr: 'CT', tier: 2, color: '#17b6c4', dark: '#0a6b74' }
  ];

  Rules.CHAIN_IDS = Rules.CHAINS.map(function (c) { return c.id; });

  var CHAIN_MAP = {};
  Rules.CHAINS.forEach(function (c) { CHAIN_MAP[c.id] = c; });
  Rules.chain = function (id) { return CHAIN_MAP[id]; };

  /* --- 座標ヘルパ ------------------------------------------------------ */
  Rules.rowOf = function (i) { return Math.floor(i / Rules.COLS); };
  Rules.colOf = function (i) { return i % Rules.COLS; };
  Rules.index = function (row, col) { return row * Rules.COLS + col; };
  Rules.label = function (i) {
    return (Rules.colOf(i) + 1) + Rules.ROW_LETTERS[Rules.rowOf(i)];
  };
  Rules.distance = function (a, b) {
    return Math.abs(Rules.rowOf(a) - Rules.rowOf(b)) + Math.abs(Rules.colOf(a) - Rules.colOf(b));
  };

  /* 上下左右の隣接マス（事前計算） */
  Rules.neighbors = (function () {
    var all = [];
    for (var i = 0; i < Rules.CELLS; i++) {
      var r = Rules.rowOf(i), c = Rules.colOf(i), n = [];
      if (r > 0) n.push(i - Rules.COLS);
      if (r < Rules.ROWS - 1) n.push(i + Rules.COLS);
      if (c > 0) n.push(i - 1);
      if (c < Rules.COLS - 1) n.push(i + 1);
      all.push(n);
    }
    return all;
  })();

  /* --- 株価表 ----------------------------------------------------------
     基準段 = チェーンの大きさから決まる 0..8 の段。
     価格 = (段 + 2 + tier) * 100
     例) 2マス/tier0 = 200、41マス/tier2 = 1200
     ---------------------------------------------------------------------- */
  function priceStep(size) {
    if (size < 2) return -1;
    if (size <= 5) return size - 2;   // 2,3,4,5 -> 0,1,2,3
    if (size <= 10) return 4;
    if (size <= 20) return 5;
    if (size <= 30) return 6;
    if (size <= 40) return 7;
    return 8;
  }
  Rules.priceStep = priceStep;

  Rules.priceOf = function (chainId, size) {
    var step = priceStep(size);
    if (step < 0) return 0;
    return (step + 2 + CHAIN_MAP[chainId].tier) * 100;
  };

  Rules.majorityBonus = function (chainId, size) { return Rules.priceOf(chainId, size) * 10; };
  Rules.minorityBonus = function (chainId, size) { return Rules.priceOf(chainId, size) * 5; };

  /* ボーナス分割は100ドル単位で切り上げ */
  Rules.roundUp100 = function (n) { return Math.ceil(n / 100) * 100; };

  Rules.isSafe = function (size) { return size >= Rules.SAFE_SIZE; };

  /* 表示用: 価格表の行 */
  Rules.PRICE_ROWS = [
    { label: '2',      test: function (s) { return s === 2; } },
    { label: '3',      test: function (s) { return s === 3; } },
    { label: '4',      test: function (s) { return s === 4; } },
    { label: '5',      test: function (s) { return s === 5; } },
    { label: '6-10',   test: function (s) { return s >= 6 && s <= 10; } },
    { label: '11-20',  test: function (s) { return s >= 11 && s <= 20; } },
    { label: '21-30',  test: function (s) { return s >= 21 && s <= 30; } },
    { label: '31-40',  test: function (s) { return s >= 31 && s <= 40; } },
    { label: '41+',    test: function (s) { return s >= 41; } }
  ];

  Rules.formatMoney = function (n) {
    var sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toLocaleString('en-US');
  };

  AQ.Rules = Rules;
})(window);

<script>
/* ==========================================================================
   ACQUIRE - ゲームエンジン
   状態遷移とルール判定のみを担当する。DOM には一切触れない。

(function (global) {

  var AQ = global.AQ;
  var R = AQ.Rules;

  /* ------------------------------------------------------------------ *
   * 乱数（シード指定で再現可能）
   * ------------------------------------------------------------------ */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

    for (var i = arr.length - 1; i > 0; i--) {

    return arr;
  }

  function zeroShares() {
    var o = {};
    R.CHAIN_IDS.forEach(function (id) { o[id] = 0; });
    return o;
  }

  /* ------------------------------------------------------------------ *
   * 盤面の読み取り
   *   board[i] === null  空き
   *   board[i] === '.'   無所属タイル
   *   board[i] === 'luxor' 等  チェーン所属
   * ------------------------------------------------------------------ */
  function sizes(s) {
    var o = zeroShares();
    for (var i = 0; i < R.CELLS; i++) {
      var v = s.board[i];
      if (v && v !== '.') o[v]++;
    }
    return o;

  E.sizes = sizes;

  E.sizeOf = function (s, chainId) {
    var n = 0;
    for (var i = 0; i < R.CELLS; i++) if (s.board[i] === chainId) n++;
    return n;
  };

  E.activeChains = function (s) {
    var sz = sizes(s);
    return R.CHAIN_IDS.filter(function (id) { return sz[id] > 0; });
  };

  E.availableChains = function (s) {
    var sz = sizes(s);
    return R.CHAIN_IDS.filter(function (id) { return sz[id] === 0; });
  };

  E.tilesOf = function (s, chainId) {
    var out = [];
    for (var i = 0; i < R.CELLS; i++) if (s.board[i] === chainId) out.push(i);
    return out;
  };

  /* 無所属タイルの連結成分（初期配置で隣り合う場合があるため必要） */
  function loneCluster(s, seeds) {
    var seen = {}, out = [], stack = seeds.slice();
    while (stack.length) {
      var t = stack.pop();
      if (seen[t] || s.board[t] !== '.') continue;
      seen[t] = true; out.push(t);
      R.neighbors[t].forEach(function (n) {
        if (!seen[n] && s.board[n] === '.') stack.push(n);

    return out;
  }

  /* ------------------------------------------------------------------ *
   * タイルを置いた時に何が起きるかを判定する
   *   single  : 何も起きない（孤立タイル）
   *   found   : 新チェーン設立
   *   blocked : 設立したいが7チェーン全て盤上 → 今は置けない（一時的）
   *   grow    : 既存チェーンの拡張
   *   merge   : 合併
   *   dead    : 安全なチェーン同士をつなぐ → 永久に置けない
   * ------------------------------------------------------------------ */
  E.analyze = function (s, i) {
    var chains = [], loneSeeds = [];
    R.neighbors[i].forEach(function (j) {
      var v = s.board[j];
      if (v === null || v === undefined) return;
      if (v === '.') loneSeeds.push(j);
      else if (chains.indexOf(v) === -1) chains.push(v);
    });

    var lones = loneSeeds.length ? loneCluster(s, loneSeeds) : [];

    if (chains.length >= 2) {
      var sz = sizes(s);
      var info = {};
      chains.forEach(function (c) { info[c] = sz[c]; });
      var safeOnes = chains.filter(function (c) { return R.isSafe(sz[c]); });
      if (safeOnes.length >= 2) {
        return { type: 'dead', chains: chains, sizes: info };
      }
      var max = Math.max.apply(null, chains.map(function (c) { return sz[c]; }));
      var candidates = chains.filter(function (c) { return sz[c] === max; });
      return { type: 'merge', chains: chains, sizes: info, lones: lones, candidates: candidates };
    }

    if (chains.length === 1) {
      return { type: 'grow', chain: chains[0], lones: lones };
    }

    if (lones.length > 0) {
      var avail = E.availableChains(s);
      if (avail.length === 0) return { type: 'blocked', lones: lones };
      return { type: 'found', lones: lones, options: avail };
    }

    return { type: 'single' };
  };

  E.isPlayable = function (s, i) {
    if (s.board[i] !== null) return false;
    var a = E.analyze(s, i);
    return a.type !== 'dead' && a.type !== 'blocked';
  };

  E.isPermanentlyDead = function (s, i) {
    if (s.board[i] !== null) return false;
    return E.analyze(s, i).type === 'dead';
  };

  E.playableTiles = function (s, player) {
    return player.tiles.filter(function (t) { return E.isPlayable(s, t); });
  };

  /* ------------------------------------------------------------------ *
   * 演出キュー & ログ
   * ------------------------------------------------------------------ */
  function fx(s, event) { s.fx.push(event); }
  function log(s, text, kind) {
    s.log.push({ text: text, kind: kind || 'info', turn: s.turnCount });
    if (s.log.length > 400) s.log.shift();
  }
  E.log = log;

  /* ------------------------------------------------------------------ *
   * ゲーム生成
   * ------------------------------------------------------------------ */
  E.newGame = function (opts) {
    opts = opts || {};
    var seed = opts.seed != null ? opts.seed : (Math.random() * 1e9) | 0;
    var rand = mulberry32(seed);

    var players = (opts.players || []).map(function (p, i) {
      return {
        idx: i,
        name: p.name,
        isHuman: !!p.isHuman,
        personality: p.personality || 'balanced',
        cash: R.START_CASH,
        tiles: [],
        shares: zeroShares()
      };
    });

    var bag = [];
    for (var i = 0; i < R.CELLS; i++) bag.push(i);
    shuffle(bag, rand);

    var bank = {};
    R.CHAIN_IDS.forEach(function (id) { bank[id] = R.SHARES_PER_CHAIN; });

    var s = {
      seed: seed,
      rand: rand,
      players: players,
      board: new Array(R.CELLS).fill(null),
      bank: bank,
      bag: bag,
      current: 0,
      phase: 'place',
      pending: null,
      fx: [],
      log: [],
      turnCount: 1,
      endDeclared: false,
      results: null,
      boughtThisTurn: 0,
      discarded: [] // 永久に置けず箱に戻したタイル
    };

    /* 初期タイル: 各プレイヤーが1枚ずつ盤面に置く */
    var starters = [];
    players.forEach(function (p) {
      var t = s.bag.pop();
      s.board[t] = '.';
      starters.push({ tile: t, player: p.idx });
    });
    fx(s, { t: 'setup', tiles: starters });
    log(s, '初期タイルを配置しました', 'system');

    /* 手札を配る */
    players.forEach(function (p) {
      while (p.tiles.length < R.HAND_SIZE && s.bag.length) p.tiles.push(s.bag.pop());
      p.tiles.sort(function (a, b) { return a - b; });
    });

    /* 手番順は初期タイルが最も左上の人から（簡易ルール） */
    var first = starters.slice().sort(function (a, b) { return a.tile - b.tile; })[0];
    s.current = first.player;

    startTurn(s);
    return s;
  };

  /* ------------------------------------------------------------------ *
   * 手番の開始
   * ------------------------------------------------------------------ */
  function startTurn(s) {
    var p = s.players[s.current];
    s.boughtThisTurn = 0;
    s.pending = null;
    fx(s, { t: 'turn', player: p.idx });

    if (E.playableTiles(s, p).length === 0) {
      // 置けるタイルが無い場合は配置を飛ばして株購入へ
      s.phase = 'buy';
      s.pending = { noPlayable: true };
      log(s, p.name + ' は置けるタイルがありません', 'warn');
    } else {
      s.phase = 'place';
    }
  }
  E.startTurn = startTurn;

  /* 今アクションすべきプレイヤー（株処分フェーズだけは手番と異なる） */
  E.actor = function (s) {
    if (s.phase === 'dispose' && s.pending && s.pending.dispose) {
      return s.players[s.pending.dispose.order[s.pending.dispose.at]];
    }
    return s.players[s.current];
  };

  /* ------------------------------------------------------------------ *
   * タイル配置
   * ------------------------------------------------------------------ */
  E.placeTile = function (s, tile) {
    if (s.phase !== 'place') throw new Error('phase');
    var p = s.players[s.current];
    var handPos = p.tiles.indexOf(tile);
    if (handPos === -1) throw new Error('not in hand');
    if (!E.isPlayable(s, tile)) throw new Error('illegal tile');

    var a = E.analyze(s, tile);
    p.tiles.splice(handPos, 1);
    s.board[tile] = '.';
    fx(s, { t: 'place', tile: tile, player: p.idx });
    log(s, p.name + ' が ' + R.label(tile) + ' に配置', 'place');

    if (a.type === 'single') {
      toBuyPhase(s);
      return;
    }

    if (a.type === 'found') {
      s.pending = { found: { tile: tile, lones: a.lones, options: a.options } };
      if (a.options.length === 1) {
        E.chooseFoundChain(s, a.options[0]);
      } else {
        s.phase = 'found';
      }
      return;
    }

    if (a.type === 'grow') {
      var tiles = [tile].concat(a.lones);
      paint(s, a.chain, tiles);
      var newSize = E.sizeOf(s, a.chain);
      fx(s, { t: 'grow', chain: a.chain, tiles: tiles, origin: tile, size: newSize });
      log(s, R.chain(a.chain).jp + ' が ' + newSize + 'マスに拡大', 'grow');
      checkSafe(s, a.chain, newSize);
      toBuyPhase(s);
      return;
    }

    if (a.type === 'merge') {
      s.pending = {
        merge: {
          tile: tile,
          lones: a.lones,
          chains: a.chains,
          sizes: a.sizes,
          survivor: null,
          defunct: null,
          idx: 0,
          maker: p.idx
        }
      };
      if (a.candidates.length === 1) {
        E.chooseSurvivor(s, a.candidates[0]);
      } else {
        s.phase = 'survivor';
        s.pending.merge.candidates = a.candidates;
      }
      return;
    }

    throw new Error('unreachable placement type: ' + a.type);
  };

  function paint(s, chainId, tiles) {
    tiles.forEach(function (t) { s.board[t] = chainId; });
  }

  function checkSafe(s, chainId, size) {
    if (size >= R.SAFE_SIZE && !s._safeAnnounced) s._safeAnnounced = {};
    if (size >= R.SAFE_SIZE) {
      s._safeAnnounced = s._safeAnnounced || {};
      if (!s._safeAnnounced[chainId]) {
        s._safeAnnounced[chainId] = true;
        fx(s, { t: 'safe', chain: chainId });
        log(s, R.chain(chainId).jp + ' が安全圏（11マス）に到達', 'safe');
      }
    } else if (s._safeAnnounced) {
      delete s._safeAnnounced[chainId];
    }
  }

  /* ------------------------------------------------------------------ *
   * 新チェーン設立
   * ------------------------------------------------------------------ */
  E.chooseFoundChain = function (s, chainId) {
    var f = s.pending && s.pending.found;
    if (!f) throw new Error('no pending found');
    if (f.options.indexOf(chainId) === -1) throw new Error('unavailable chain');

    var p = s.players[s.current];
    var tiles = [f.tile].concat(f.lones);
    paint(s, chainId, tiles);
    var size = tiles.length;

    fx(s, { t: 'found', chain: chainId, tiles: tiles, origin: f.tile, player: p.idx, size: size });
    log(s, p.name + ' が ' + R.chain(chainId).jp + ' を設立（' + size + 'マス）', 'found');

    /* 設立者ボーナス: 無料で1株 */
    if (s.bank[chainId] > 0) {
      s.bank[chainId]--;
      p.shares[chainId]++;
      fx(s, { t: 'founder-share', chain: chainId, player: p.idx });
      log(s, p.name + ' は設立者ボーナスで ' + R.chain(chainId).jp + ' 1株を獲得', 'stock');
    }

    checkSafe(s, chainId, size);
    s.pending = null;
    toBuyPhase(s);
  };

  /* ------------------------------------------------------------------ *
   * 合併
   * ------------------------------------------------------------------ */
  E.chooseSurvivor = function (s, chainId) {
    var m = s.pending && s.pending.merge;
    if (!m) throw new Error('no pending merge');
    if (m.chains.indexOf(chainId) === -1) throw new Error('not a merging chain');

    m.survivor = chainId;
    m.defunct = m.chains.filter(function (c) { return c !== chainId; })
      .sort(function (a, b) { return m.sizes[b] - m.sizes[a]; });

    /* 置いたタイルと周囲の無所属タイルは即座に存続チェーンへ */
    var joining = [m.tile].concat(m.lones);
    paint(s, chainId, joining);

    fx(s, {
      t: 'merge-start',
      survivor: chainId,
      defunct: m.defunct.slice(),
      tile: m.tile,
      joining: joining
    });
    log(s,
      R.chain(chainId).jp + ' が ' +
      m.defunct.map(function (c) { return R.chain(c).jp; }).join('・') + ' を吸収合併',
      'merge');

    m.idx = 0;
    processDefunct(s);
  };

  /* 消滅チェーンを1つずつ処理する */
  function processDefunct(s) {
    var m = s.pending.merge;
    if (m.idx >= m.defunct.length) { finishMerge(s); return; }

    var d = m.defunct[m.idx];
    var size = m.sizes[d];

    /* ボーナス支払い */
    var payouts = E.bonusSplit(s, d, size);
    payouts.forEach(function (pay) {
      s.players[pay.player].cash += pay.amount;
      log(s, s.players[pay.player].name + ' が ' + R.chain(d).jp + ' の' +
        (pay.kind === 'majority' ? '筆頭株主' : '第2位株主') + 'ボーナス ' +
        R.formatMoney(pay.amount) + ' を獲得', 'money');
    });
    if (payouts.length) fx(s, { t: 'bonus', chain: d, size: size, payouts: payouts });

    /* 株の処分待ち行列（合併を起こしたプレイヤーから時計回り） */
    var order = [];
    for (var k = 0; k < s.players.length; k++) {
      var pi = (m.maker + k) % s.players.length;
      if (s.players[pi].shares[d] > 0) order.push(pi);
    }

    if (order.length === 0) {
      absorbDefunct(s, d);
      m.idx++;
      processDefunct(s);
      return;
    }

    s.phase = 'dispose';
    s.pending.dispose = {
      defunct: d,
      size: size,
      price: R.priceOf(d, size),
      survivor: m.survivor,
      order: order,
      at: 0
    };
  }

  /* 筆頭 / 第2位ボーナスの計算（同数は分割して100ドル単位切り上げ） */
  E.bonusSplit = function (s, chainId, size) {
    var maj = R.majorityBonus(chainId, size);
    var min = R.minorityBonus(chainId, size);
    var holders = s.players.filter(function (p) { return p.shares[chainId] > 0; });
    if (holders.length === 0) return [];

    var sorted = holders.slice().sort(function (a, b) { return b.shares[chainId] - a.shares[chainId]; });
    var top = sorted[0].shares[chainId];
    var tops = sorted.filter(function (p) { return p.shares[chainId] === top; });
    var out = [];

    if (tops.length > 1) {
      /* 筆頭が同数 → 筆頭+第2位を合算して山分け */
      var each = R.roundUp100((maj + min) / tops.length);
      tops.forEach(function (p) {
        out.push({ player: p.idx, amount: each, kind: 'majority', shares: p.shares[chainId] });
      });
      return out;
    }

    out.push({ player: tops[0].idx, amount: maj, kind: 'majority', shares: top });

    var rest = sorted.filter(function (p) { return p.idx !== tops[0].idx; });
    if (rest.length === 0) {
      /* 株主が1人だけなら第2位ボーナスも同じ人へ */
      out.push({ player: tops[0].idx, amount: min, kind: 'minority', shares: top });
      return out;
    }

    var second = rest[0].shares[chainId];
    var seconds = rest.filter(function (p) { return p.shares[chainId] === second; });
    var amt = R.roundUp100(min / seconds.length);
    seconds.forEach(function (p) {
      out.push({ player: p.idx, amount: amt, kind: 'minority', shares: second });
    });
    return out;
  };

  /* 消滅チェーン株の処分オプションの上限 */
  E.disposalLimits = function (s, playerIdx) {
    var d = s.pending.dispose;
    var held = s.players[playerIdx].shares[d.defunct];
    var maxTrade = Math.min(held - (held % 2), s.bank[d.survivor] * 2);
    return { held: held, price: d.price, maxSell: held, maxTrade: maxTrade };
  };

  E.submitDisposal = function (s, choice) {
    if (s.phase !== 'dispose') throw new Error('phase');
    var d = s.pending.dispose;
    var pi = d.order[d.at];
    var p = s.players[pi];
    var held = p.shares[d.defunct];

    var sell = Math.max(0, choice.sell | 0);
    var trade = Math.max(0, choice.trade | 0);
    if (trade % 2 !== 0) throw new Error('trade must be even');
    if (sell + trade > held) throw new Error('too many shares');
    if (trade / 2 > s.bank[d.survivor]) throw new Error('not enough survivor shares');

    if (sell > 0) {
      var gain = sell * d.price;
      p.cash += gain;
      p.shares[d.defunct] -= sell;
      s.bank[d.defunct] += sell;
      fx(s, { t: 'sell', player: pi, chain: d.defunct, count: sell, amount: gain });
      log(s, p.name + ' が ' + R.chain(d.defunct).jp + ' ' + sell + '株を売却（+' +
        R.formatMoney(gain) + '）', 'money');
    }
    if (trade > 0) {
      var got = trade / 2;
      p.shares[d.defunct] -= trade;
      s.bank[d.defunct] += trade;
      p.shares[d.survivor] += got;
      s.bank[d.survivor] -= got;
      fx(s, { t: 'trade', player: pi, from: d.defunct, to: d.survivor, count: trade, got: got });
      log(s, p.name + ' が ' + R.chain(d.defunct).jp + ' ' + trade + '株を ' +
        R.chain(d.survivor).jp + ' ' + got + '株に交換', 'stock');
    }
    var keep = held - sell - trade;
    if (keep > 0) {
      log(s, p.name + ' は ' + R.chain(d.defunct).jp + ' ' + keep + '株を保持', 'stock');
    }

    d.at++;
    if (d.at < d.order.length) return; // 次の株主へ

    /* この消滅チェーンの処分完了 → 盤面を吸収 */
    var m = s.pending.merge;
    absorbDefunct(s, d.defunct);
    s.pending.dispose = null;
    m.idx++;
    processDefunct(s);
  };

  function absorbDefunct(s, defunctId) {
    var m = s.pending.merge;
    var tiles = E.tilesOf(s, defunctId);
    paint(s, m.survivor, tiles);
    fx(s, {
      t: 'absorb',
      chain: m.survivor,
      from: defunctId,
      tiles: tiles,
      origin: m.tile
    });
    if (s._safeAnnounced) delete s._safeAnnounced[defunctId];
  }

  function finishMerge(s) {
    var m = s.pending.merge;
    var size = E.sizeOf(s, m.survivor);
    fx(s, { t: 'merge-end', chain: m.survivor, size: size });
    log(s, R.chain(m.survivor).jp + ' は ' + size + 'マスになりました', 'merge');
    checkSafe(s, m.survivor, size);
    s.pending = null;
    toBuyPhase(s);
  }

  /* ------------------------------------------------------------------ *
   * 株の購入
   * ------------------------------------------------------------------ */
  function toBuyPhase(s) {
    s.phase = 'buy';
    s.boughtThisTurn = 0;
  }

  E.buyOptions = function (s, player) {
    var sz = sizes(s);
    return R.CHAIN_IDS.filter(function (id) {
      return sz[id] > 0 && s.bank[id] > 0;
    }).map(function (id) {
      return { id: id, size: sz[id], price: R.priceOf(id, sz[id]), left: s.bank[id] };
    });
  };

  E.buy = function (s, cart) {
    if (s.phase !== 'buy') throw new Error('phase');
    var p = s.players[s.current];
    var sz = sizes(s);
    var total = 0, count = 0;

    R.CHAIN_IDS.forEach(function (id) {
      var n = (cart && cart[id]) | 0;
      if (n <= 0) return;
      if (sz[id] === 0) throw new Error('chain not on board: ' + id);
      if (n > s.bank[id]) throw new Error('not enough shares: ' + id);
      count += n;
      total += n * R.priceOf(id, sz[id]);
    });

    if (count > R.MAX_BUY_PER_TURN) throw new Error('max 3 shares');
    if (total > p.cash) throw new Error('not enough cash');

    R.CHAIN_IDS.forEach(function (id) {
      var n = (cart && cart[id]) | 0;
      if (n <= 0) return;
      var cost = n * R.priceOf(id, sz[id]);
      p.cash -= cost;
      p.shares[id] += n;
      s.bank[id] -= n;
      fx(s, { t: 'buy', player: p.idx, chain: id, count: n, cost: cost });
      log(s, p.name + ' が ' + R.chain(id).jp + ' ' + n + '株を購入（-' +
        R.formatMoney(cost) + '）', 'stock');
    });
    if (count === 0) log(s, p.name + ' は株を購入しませんでした', 'info');

    s.boughtThisTurn = count;
    endTurn(s);
  };

  /* ------------------------------------------------------------------ *
   * 終了条件
   * ------------------------------------------------------------------ */
  E.canDeclareEnd = function (s) {
    var sz = sizes(s);
    var active = R.CHAIN_IDS.filter(function (id) { return sz[id] > 0; });
    if (active.length === 0) return false;
    if (active.some(function (id) { return sz[id] >= R.END_SIZE; })) return true;
    return active.every(function (id) { return sz[id] >= R.SAFE_SIZE; });
  };

  E.declareEnd = function (s) {
    if (!E.canDeclareEnd(s)) throw new Error('cannot declare end');
    s.endDeclared = true;
    log(s, s.players[s.current].name + ' がゲーム終了を宣言しました', 'system');
    fx(s, { t: 'declare-end', player: s.current });
  };

  /* ------------------------------------------------------------------ *
   * 手番の終了 → 補充 → 次のプレイヤー
   * ------------------------------------------------------------------ */
  function endTurn(s) {
    var p = s.players[s.current];

    if (s.endDeclared) { finalize(s); return; }

    /* 永久に置けないタイルを捨てて引き直す */
    var dumped = p.tiles.filter(function (t) { return E.isPermanentlyDead(s, t); });
    if (dumped.length) {
      p.tiles = p.tiles.filter(function (t) { return !E.isPermanentlyDead(s, t); });
      s.discarded = s.discarded.concat(dumped); // 箱に戻す（山札には戻らない）
      log(s, p.name + ' が死にタイル ' + dumped.map(R.label).join('・') + ' を交換', 'info');
      fx(s, { t: 'discard', player: p.idx, tiles: dumped });
    }

    /* 手札を6枚まで補充 */
    var drawn = [];
    while (p.tiles.length < R.HAND_SIZE && s.bag.length > 0) {
      var t = s.bag.pop();
      p.tiles.push(t);
      drawn.push(t);
    }
    p.tiles.sort(function (a, b) { return a - b; });
    if (drawn.length) fx(s, { t: 'draw', player: p.idx, tiles: drawn });

    /* 全員が置けなくなったら終了 */
    s.current = (s.current + 1) % s.players.length;
    if (s.current === 0) s.turnCount++;

    var anyone = s.players.some(function (pl) {
      return E.playableTiles(s, pl).length > 0 || pl.tiles.length > 0;
    });
    if (!anyone && s.bag.length === 0) { finalize(s); return; }

    startTurn(s);
  }
  E.endTurn = endTurn;

  /* ------------------------------------------------------------------ *
   * 最終清算
   * ------------------------------------------------------------------ */
  function finalize(s) {
    var sz = sizes(s);
    var active = R.CHAIN_IDS.filter(function (id) { return sz[id] > 0; });
    var breakdown = s.players.map(function (p) {
      return { player: p.idx, bonus: 0, stock: 0, start: p.cash };
    });

    log(s, '=== 最終清算 ===', 'system');

    active.forEach(function (id) {
      E.bonusSplit(s, id, sz[id]).forEach(function (pay) {
        s.players[pay.player].cash += pay.amount;
        breakdown[pay.player].bonus += pay.amount;
        log(s, s.players[pay.player].name + ' : ' + R.chain(id).jp + ' ' +
          (pay.kind === 'majority' ? '筆頭' : '第2位') + 'ボーナス ' +
          R.formatMoney(pay.amount), 'money');
      });
    });

    active.forEach(function (id) {
      var price = R.priceOf(id, sz[id]);
      s.players.forEach(function (p) {
        var n = p.shares[id];
        if (n <= 0) return;
        var amount = n * price;
        p.cash += amount;
        p.shares[id] = 0;
        s.bank[id] += n;
        breakdown[p.idx].stock += amount;
        log(s, p.name + ' : ' + R.chain(id).jp + ' ' + n + '株を清算 ' +
          R.formatMoney(amount), 'money');
      });
    });

    fx(s, { t: 'final-settle', breakdown: breakdown });

    var ranking = s.players.slice().sort(function (a, b) { return b.cash - a.cash; })
      .map(function (p, i) {
        return {
          player: p.idx, name: p.name, cash: p.cash, rank: i + 1,
          bonus: breakdown[p.idx].bonus, stock: breakdown[p.idx].stock,
          isHuman: p.isHuman
        };
      });
    /* 同額は同順位 */
    for (var i = 1; i < ranking.length; i++) {
      if (ranking[i].cash === ranking[i - 1].cash) ranking[i].rank = ranking[i - 1].rank;
    }

    s.results = ranking;
    s.phase = 'gameover';
    fx(s, { t: 'gameover', ranking: ranking });
    log(s, '優勝: ' + ranking[0].name + '（' + R.formatMoney(ranking[0].cash) + '）', 'system');
  }
  E.finalize = finalize;

  /* ------------------------------------------------------------------ *
   * 評価ヘルパ（UI / AI 共用）
   * ------------------------------------------------------------------ */
  E.netWorth = function (s, player) {
    var sz = sizes(s);
    var total = player.cash;
    R.CHAIN_IDS.forEach(function (id) {
      if (sz[id] > 0 && player.shares[id] > 0) {
        total += player.shares[id] * R.priceOf(id, sz[id]);
      }
    });
    return total;
  };

  /* そのチェーンで自分が筆頭/第2位かを返す */
  E.standing = function (s, chainId, playerIdx) {
    var counts = s.players.map(function (p) { return p.shares[chainId]; });
    var mine = counts[playerIdx];
    if (mine === 0) return 'none';
    var better = counts.filter(function (c, i) { return i !== playerIdx && c > mine; }).length;
    if (better === 0) return 'majority';
    if (better === 1) return 'minority';
    return 'other';
  };

  AQ.Engine = E;
})(window);
</script>
<script>
/* ==========================================================================
   ACQUIRE - ルールベース CPU
   学習も探索木も使わない。すべての選択肢を「期待ドル」に換算して比較する。

   換算の柱:
     1. 株は最終清算で「そのときの株価」に戻る → 値上がり分が利益
     2. 筆頭ボーナス = 株価 x10 / 第2位 = 株価 x5 → 地位の改善は株価の何倍にもなる
     3. 合併ボーナスは即金。自分が取れるなら大きく加点、他人に渡すなら減点
   これで「設立」「拡大」「合併」「捨て牌」を同じ物差しで比較できる。
   ========================================================================== */
(function (global) {
  'use strict';

  var AQ = global.AQ;
  var R = AQ.Rules;
  var E = AQ.Engine;
  var AI = {};

  /* 性格ごとの重み。
     rival は「相手の利益をどれだけ嫌うか」。0.7 前後が最も強い（実測）ので
     そこを中心に、性格づけとして前後に散らしてある。 */
  var PERSONA = {
    balanced:   { buy: 1.00, bonus: 1.00, rival: 0.70, hoard: 600,  label: 'バランス' },
    aggressive: { buy: 1.25, bonus: 1.20, rival: 0.50, hoard: 0,    label: 'アグレッシブ' },
    cautious:   { buy: 0.85, bonus: 0.90, rival: 0.85, hoard: 1600, label: 'キャッシュ重視' },
    tycoon:     { buy: 1.10, bonus: 1.35, rival: 0.65, hoard: 300,  label: 'マージャー' }
  };
  AI.PERSONA = PERSONA;
  function persona(p) { return PERSONA[p.personality] || PERSONA.balanced; }

  function others(s, p) {
    return s.players.filter(function (x) { return x.idx !== p.idx; });
  }
  function maxOtherShares(s, p, chainId) {
    return others(s, p).reduce(function (m, x) { return Math.max(m, x.shares[chainId]); }, 0);
  }
  function jitter(s, scale) { return (s.rand() - 0.5) * (scale || 60); }

  /* ------------------------------------------------------------------ *
   * このチェーンは今後どれくらい伸びそうか（残りタイル数からの粗い見積り）
   * ------------------------------------------------------------------ */
  function expectedGrowth(s, size) {
    if (size >= R.END_SIZE) return 0;
    var remaining = s.bag.length;
    var active = E.activeChains(s).length || 1;
    /* 残タイルのうち、このチェーンに付く分をざっくり見積もる */
    var g = Math.round(remaining / (active + 2));
    return Math.max(1, Math.min(16, g));
  }

  /* 現時点で清算したら p がそのチェーンから受け取るボーナス額 */
  function bonusFor(s, p, chainId, size) {
    var out = 0;
    E.bonusSplit(s, chainId, size).forEach(function (pay) {
      if (pay.player === p.idx) out += pay.amount;
    });
    return out;
  }

  /* p の持ち株を delta 変化させたときのボーナス差分（一時的に書き換えて計算） */
  function bonusDelta(s, p, chainId, size, delta) {
    var before = bonusFor(s, p, chainId, size);
    p.shares[chainId] += delta;
    var after = bonusFor(s, p, chainId, size);
    p.shares[chainId] -= delta;
    return after - before;
  }

  /* ------------------------------------------------------------------ *
   * チェーンが add マス伸びることの価値（全プレイヤー分をドルで合算）
   *   株価上昇 x 持ち株 + ボーナス倍率（筆頭 x10 / 第2位 x5）
   * ------------------------------------------------------------------ */
  function growthValue(s, p, chainId, size, add) {
    if (add <= 0) return 0;
    var w = persona(p);
    var per = R.priceOf(chainId, size + add) - R.priceOf(chainId, size);
    if (per === 0) {
      /* 段の途中でも「次の段に近づく」分は価値がある */
      per = 100 * add / bracketWidth(size);
    }
    var v = 0;
    s.players.forEach(function (x) {
      var gain = x.shares[chainId] * per;
      var st = E.standing(s, chainId, x.idx);
      if (st === 'majority') gain += per * 10;
      else if (st === 'minority') gain += per * 5;
      v += (x.idx === p.idx) ? gain : -gain * w.rival;
    });
    return v;
  }

  function bracketWidth(size) {
    if (size <= 5) return 1;
    if (size <= 10) return 5;
    if (size <= 40) return 10;
    return 20;
  }

  /* ------------------------------------------------------------------ *
   * 合併の価値（存続チェーンを固定して評価）
   * ------------------------------------------------------------------ */
  function evaluateMerge(s, p, info, survivor) {
    var w = persona(p);
    var v = 0;
    var defunct = info.chains.filter(function (c) { return c !== survivor; });
    var totalTiles = 0;
    info.chains.forEach(function (c) { totalTiles += info.sizes[c]; });
    var lones = info.lones ? info.lones.length : 0;

    defunct.forEach(function (d) {
      var size = info.sizes[d];
      var price = R.priceOf(d, size);

      /* 即金のボーナス。自分の取り分は満額、他人の取り分は割り引いて減点 */
      E.bonusSplit(s, d, size).forEach(function (pay) {
        if (pay.player === p.idx) v += pay.amount * w.bonus;
        else v -= pay.amount * w.rival;
      });

      /* 持ち株は売却／2:1交換に変えられる（現金化の自由度） */
      v += p.shares[d] * price * 0.15;

      /* 育てている最中の小チェーンを潰すのは将来価値の取りこぼし */
      if (p.shares[d] >= 3 && size <= 6) {
        v -= growthValue(s, p, d, size, expectedGrowth(s, size)) * 0.4;
      }
    });

    /* 存続チェーンが一気に伸びる */
    var oldSize = info.sizes[survivor];
    var newSize = totalTiles + 1 + lones;
    v += growthValue(s, p, survivor, oldSize, newSize - oldSize);

    /* 安全圏に入ると以後は絶対に吸収されない */
    if (oldSize < R.SAFE_SIZE && newSize >= R.SAFE_SIZE) {
      var mine = p.shares[survivor];
      var maxOth = maxOtherShares(s, p, survivor);
      if (mine > maxOth) v += R.priceOf(survivor, newSize) * 3;
      else if (mine === 0) v -= R.priceOf(survivor, newSize) * 2.5;
    }

    /* 41マスは終了トリガー */
    if (newSize >= R.END_SIZE) v += isLeading(s, p) ? 6000 : -6000;

    return v;
  }

  /* ------------------------------------------------------------------ *
   * 最終資産の見込み（= 今ゲームが終わったときの所持金）
   * ------------------------------------------------------------------ */
  function projectedWorth(s, playerIdx) {
    var sz = E.sizes(s);
    var p = s.players[playerIdx];
    var total = p.cash;
    R.CHAIN_IDS.forEach(function (id) {
      if (sz[id] === 0) return;
      total += p.shares[id] * R.priceOf(id, sz[id]);
      E.bonusSplit(s, id, sz[id]).forEach(function (pay) {
        if (pay.player === playerIdx) total += pay.amount;
      });
    });
    return total;
  }
  AI.projectedWorth = projectedWorth;

  function isLeading(s, p) {
    var mine = projectedWorth(s, p.idx);
    return others(s, p).every(function (x) { return projectedWorth(s, x.idx) <= mine; });
  }

  /* ------------------------------------------------------------------ *
   * 新チェーン設立の価値
   * ------------------------------------------------------------------ */
  function foundValue(s, p, options) {
    var best = 0;
    options.forEach(function (id) {
      var startPrice = R.priceOf(id, 2);
      var g = expectedGrowth(s, 2);
      var projPrice = R.priceOf(id, Math.min(R.END_SIZE, 2 + g));

      /* 無料でもらえる1株の将来価値 */
      var v = projPrice;
      /* 設立直後は最安値。買い増せるなら先行者として筆頭を取りやすい */
      if (p.cash >= startPrice * 3) v += projPrice * 1.6;
      else if (p.cash >= startPrice) v += projPrice * 0.5;
      /* 死に株だったものが復活する */
      v += p.shares[id] * projPrice * 0.8;
      /* 相手の死に株を蘇らせてしまう分は減点 */
      v -= maxOtherShares(s, p, id) * projPrice * 0.5;
      if (v > best) best = v;
    });
    return best;
  }

  /* ------------------------------------------------------------------ *
   * タイル1枚のスコア（単位はドル相当）
   * ------------------------------------------------------------------ */
  function scoreTile(s, p, tile) {
    var a = E.analyze(s, tile);
    var sz = E.sizes(s);

    if (a.type === 'dead' || a.type === 'blocked') return -Infinity;

    if (a.type === 'single') {
      /* 誰の得にもならない「捨て牌」。周囲が空いているほど無害 */
      var near = 0;
      R.neighbors[tile].forEach(function (n) {
        R.neighbors[n].forEach(function (nn) { if (s.board[nn]) near++; });
      });
      return 40 - near * 12 + jitter(s, 20);
    }

    if (a.type === 'found') {
      return foundValue(s, p, a.options) + jitter(s);
    }

    if (a.type === 'grow') {
      var size = sz[a.chain];
      var add = 1 + a.lones.length;
      var newSize = size + add;
      var v = growthValue(s, p, a.chain, size, add);

      /* 安全圏の分かれ目 */
      if (size < R.SAFE_SIZE && newSize >= R.SAFE_SIZE) {
        var mine = p.shares[a.chain];
        var maxOth = maxOtherShares(s, p, a.chain);
        if (mine > maxOth) v += R.priceOf(a.chain, newSize) * 3;
        else if (mine === 0) v -= R.priceOf(a.chain, newSize) * 2.5;
        else v -= R.priceOf(a.chain, newSize) * 0.8;
      }
      if (newSize >= R.END_SIZE) v += isLeading(s, p) ? 6000 : -6000;
      return v + jitter(s);
    }

    if (a.type === 'merge') {
      var best = -Infinity;
      a.candidates.forEach(function (c) {
        best = Math.max(best, evaluateMerge(s, p, a, c));
      });
      return best + jitter(s);
    }

    return jitter(s);
  }
  AI.scoreTile = scoreTile;

  /* ------------------------------------------------------------------ *
   * 公開 API
   * ------------------------------------------------------------------ */
  AI.chooseTile = function (s, p) {
    var legal = E.playableTiles(s, p);
    if (!legal.length) return null;
    var best = legal[0], bestScore = -Infinity;
    legal.forEach(function (t) {
      var sc = scoreTile(s, p, t);
      if (sc > bestScore) { bestScore = sc; best = t; }
    });
    return best;
  };

  AI.chooseFoundChain = function (s, p, options) {
    var g = expectedGrowth(s, 2);
    var best = options[0], bestScore = -Infinity;
    options.forEach(function (id) {
      var projPrice = R.priceOf(id, Math.min(R.END_SIZE, 2 + g));
      var startPrice = R.priceOf(id, 2);
      var sc = projPrice;
      sc += p.shares[id] * projPrice * 0.8;            // 手持ちの死に株が復活
      sc -= maxOtherShares(s, p, id) * projPrice * 0.5; // 相手の死に株も復活してしまう
      /* 買い増す余力があるなら高ティアの方が儲かる。無いなら安い方 */
      sc += (p.cash >= startPrice * 3) ? projPrice * 0.6 : -startPrice * 2;
      sc += (s.rand() - 0.5) * 50;
      if (sc > bestScore) { bestScore = sc; best = id; }
    });
    return best;
  };

  AI.chooseSurvivor = function (s, p, info, candidates) {
    var best = candidates[0], bestScore = -Infinity;
    candidates.forEach(function (c) {
      var sc = evaluateMerge(s, p, info, c);
      if (sc > bestScore) { bestScore = sc; best = c; }
    });
    return best;
  };

  /* ------------------------------------------------------------------ *
   * 消滅チェーンの株の処分
   *   売却 = 即金 / 交換 = 2株を存続1株に / 保持 = 再設立に賭ける
   * ------------------------------------------------------------------ */
  AI.disposal = function (s, p) {
    var d = s.pending.dispose;
    var held = p.shares[d.defunct];
    var survivor = d.survivor;
    var survSize = E.sizeOf(s, survivor);
    var survPrice = R.priceOf(survivor, survSize);
    var g = expectedGrowth(s, survSize);
    var survProj = R.priceOf(survivor, Math.min(R.END_SIZE, survSize + g));

    /* 交換: 2株 -> 1株。存続チェーンで地位が上がるなら価値が高い */
    var trade = 0;
    if (s.bank[survivor] > 0 && held >= 2) {
      var needed = Math.max(0, maxOtherShares(s, p, survivor) - p.shares[survivor] + 1);
      var wantShares = Math.min(needed, s.bank[survivor]);
      if (wantShares > 0) {
        /* 筆頭を取れるなら、そのために必要な分だけ交換する */
        var gainIfMajority = bonusDelta(s, p, survivor, survSize, wantShares);
        var costOfTrade = wantShares * 2 * d.price; // 売却していれば得られた現金
        if (gainIfMajority + wantShares * survProj > costOfTrade) {
          var t = Math.min(held, wantShares * 2, s.bank[survivor] * 2);
          trade = t - (t % 2);
        }
      }
      /* 地位が取れなくても、存続側の方が明らかに伸びるなら乗り換える */
      if (trade === 0 && held >= 4 && survProj > d.price * 2.2) {
        trade = Math.min(2, s.bank[survivor] * 2);
        trade -= trade % 2;
      }
    }

    var remain = held - trade;

    /* 保持: 再設立されれば価値が戻るが、されなければ紙切れ */
    var keep = 0;
    var canRefound = E.availableChains(s).length + 1 > 0 && s.bag.length > 12;
    if (canRefound && d.size <= 4 && remain >= 2) keep = 1;
    keep = Math.max(0, Math.min(keep, remain));

    return { sell: remain - keep, trade: trade };
  };

  /* ------------------------------------------------------------------ *
   * 株の購入（1株ずつ、期待ドルが最大の株を貪欲に選ぶ）
   * ------------------------------------------------------------------ */
  function buyValue(s, p, opt) {
    var w = persona(p);
    var g = expectedGrowth(s, opt.size);
    var projSize = Math.min(R.END_SIZE, opt.size + g);
    var projPrice = R.priceOf(opt.id, projSize);

    /* 1) 値上がり益（買値は清算で戻ってくる前提） */
    var v = (projPrice - opt.price);

    /* 2) ボーナス地位の改善。確実ではないので割り引く */
    v += bonusDelta(s, p, opt.id, projSize, 1) * 0.5 * w.bonus;

    /* 3) 残り株が少ないチェーンは押さえておく価値がある */
    if (opt.left <= 5) v += projPrice * 0.4;

    /* 4) 安全圏のチェーンは確実にボーナスが出るので堅い */
    if (opt.size >= R.SAFE_SIZE) v += projPrice * 0.2;

    return v * w.buy + (s.rand() - 0.5) * 80;
  }

  AI.buyCart = function (s, p) {
    var w = persona(p);
    var cart = {};
    var budget = p.cash;
    var endgame = E.canDeclareEnd(s) || s.bag.length < 8;
    var reserve = endgame ? 0 : w.hoard;

    /* 評価中だけ持ち株を仮に増やすので、必ず元に戻す */
    var applied = {};
    try {
      for (var k = 0; k < R.MAX_BUY_PER_TURN; k++) {
        var opts = E.buyOptions(s).filter(function (o) {
          return o.left - (cart[o.id] || 0) > 0 && o.price <= budget;
        });
        if (!opts.length) break;

        var best = null, bestV = -Infinity;
        opts.forEach(function (o) {
          var v = buyValue(s, p, o);
          if (budget - o.price < reserve) v -= o.price;
          if (v > bestV) { bestV = v; best = o; }
        });

        if (!best || bestV <= 0) break;
        cart[best.id] = (cart[best.id] || 0) + 1;
        applied[best.id] = (applied[best.id] || 0) + 1;
        p.shares[best.id]++;          // 次の1株の評価に反映させる
        budget -= best.price;
      }
    } finally {
      R.CHAIN_IDS.forEach(function (id) {
        if (applied[id]) p.shares[id] -= applied[id];
      });
    }
    return cart;
  };

  AI.shouldDeclareEnd = function (s, p) {
    if (!E.canDeclareEnd(s)) return false;
    var mine = projectedWorth(s, p.idx);
    var best = 0;
    others(s, p).forEach(function (x) { best = Math.max(best, projectedWorth(s, x.idx)); });
    /* 勝っているなら終わらせる。負けているなら粘る */
    return mine > best;
  };

  AQ.AI = AI;
})(window);
</script>
<script>
/* ==========================================================================
   ACQUIRE - UI レイヤー
   エンジンが積んだ演出キュー(state.fx)を順番に再生し、DOM を更新する。
   ========================================================================== */
(function (global) {
  'use strict';

  var AQ = global.AQ;
  var R = AQ.Rules;
  var Engine = AQ.Engine;
  var AI = AQ.AI;

  /* ------------------------------------------------------------------ *
   * DOM
   * ------------------------------------------------------------------ */
  var $ = function (id) { return document.getElementById(id); };
  var el = {
    board: $('board'), boardGlow: $('boardGlow'), fxLayer: $('fxLayer'),
    hand: $('hand'), handOwner: $('handOwner'), handHint: $('handHint'),
    actionBar: $('actionBar'), players: $('players'), chains: $('chains'),
    log: $('log'), overlay: $('overlay'), toasts: $('toasts'),
    statusTurn: $('statusTurn'), statusPhase: $('statusPhase'), status: $('status'),
    confetti: $('confetti'),
    btnNew: $('btnNew'), btnRules: $('btnRules'), btnSound: $('btnSound')
  };

  /* ------------------------------------------------------------------ *
   * UI 状態
   * ------------------------------------------------------------------ */
  var state = null;
  var cells = [];
  var view = new Array(R.CELLS).fill(null); // 現在 DOM に描かれている盤面
  var selectedTile = null;
  var cart = {};
  var declareIntent = false;
  var busy = false;
  var prevCash = {};
  var prevShares = {};
  var lastLogCount = 0;
  var lastActorIdx = -1;
  var handSignature = '';
  var speed = 1;

  var TIMING = {
    aiThink: 520,
    place: 420,
    paintStep: 55,
    found: 900,
    merge: 1100,
    absorb: 800,
    bonus: 700,
    stock: 500,
    small: 260
  };
  function ms(n) { return n * speed; }
  function sleep(n) { return new Promise(function (r) { setTimeout(r, ms(n)); }); }

  var PLAYER_COLORS = ['#e9c46a', '#4ade80', '#60a5fa', '#f472b6', '#fb923c', '#a78bfa'];

  /* ------------------------------------------------------------------ *
   * サウンド（WebAudio の簡易シンセ）
   * ------------------------------------------------------------------ */
  var Sound = {
    ctx: null,
    enabled: true,
    ensure: function () {
      if (!this.ctx) {
        var C = global.AudioContext || global.webkitAudioContext;
        if (C) this.ctx = new C();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    tone: function (freq, dur, type, gain, delay) {
      if (!this.enabled) return;
      var ctx = this.ensure(); if (!ctx) return;
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain || .07, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + .02);
    },
    sweep: function (f1, f2, dur, gain) {
      if (!this.enabled) return;
      var ctx = this.ensure(); if (!ctx) return;
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(gain || .05, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + .02);
    },
    place:  function () { this.tone(420, .09, 'triangle', .08); this.tone(620, .07, 'sine', .04, .03); },
    found:  function () { [523, 659, 784, 1047].forEach(function (f, i) { Sound.tone(f, .35, 'triangle', .06, i * .07); }); },
    merge:  function () { this.sweep(160, 900, .55, .06); this.tone(110, .5, 'sawtooth', .04); },
    coin:   function () { this.tone(988, .1, 'square', .05); this.tone(1319, .16, 'square', .04, .06); },
    stock:  function () { this.tone(660, .1, 'sine', .05); this.tone(880, .12, 'sine', .04, .05); },
    safe:   function () { [784, 988, 1175].forEach(function (f, i) { Sound.tone(f, .3, 'sine', .05, i * .06); }); },
    turn:   function () { this.tone(330, .12, 'sine', .04); },
    win:    function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { Sound.tone(f, .5, 'triangle', .07, i * .11); }); },
    error:  function () { this.tone(150, .18, 'square', .05); }
  };

  /* ------------------------------------------------------------------ *
   * 小さな演出ユーティリティ
   * ------------------------------------------------------------------ */
  function rectOf(node) { return node.getBoundingClientRect(); }

  function flyTile(fromRect, toRect, label) {
    var d = document.createElement('div');
    d.className = 'flying-tile';
    d.textContent = label;
    d.style.left = fromRect.left + 'px';
    d.style.top = fromRect.top + 'px';
    d.style.width = fromRect.width + 'px';
    d.style.height = fromRect.height + 'px';
    document.body.appendChild(d);
    var dx = toRect.left + toRect.width / 2 - (fromRect.left + fromRect.width / 2);
    var dy = toRect.top + toRect.height / 2 - (fromRect.top + fromRect.height / 2);
    var scale = toRect.width / Math.max(1, fromRect.width);
    requestAnimationFrame(function () {
      d.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ') rotate(8deg)';
      d.style.opacity = '0';
    });
    setTimeout(function () { d.remove(); }, ms(760));
  }

  function flyStock(fromRect, toRect, color, dark, delay) {
    setTimeout(function () {
      var d = document.createElement('div');
      d.className = 'flying-stock';
      d.style.setProperty('--c', color);
      d.style.setProperty('--cd', dark);
      d.style.left = (fromRect.left + fromRect.width / 2 - 17) + 'px';
      d.style.top = (fromRect.top + fromRect.height / 2 - 22) + 'px';
      document.body.appendChild(d);
      var dx = toRect.left + toRect.width / 2 - (fromRect.left + fromRect.width / 2);
      var dy = toRect.top + toRect.height / 2 - (fromRect.top + fromRect.height / 2);
      requestAnimationFrame(function () {
        d.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 40 - 20) + 'deg) scale(.6)';
        d.style.opacity = '0';
      });
      setTimeout(function () { d.remove(); }, ms(900));
    }, ms(delay || 0));
  }

  function floatText(anchor, text, cls) {
    if (!anchor) return;
    var r = rectOf(anchor);
    var d = document.createElement('div');
    d.className = 'float-text ' + (cls || 'gain');
    d.textContent = text;
    d.style.left = (r.left + r.width / 2) + 'px';
    d.style.top = (r.top + r.height * .3) + 'px';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, ms(1450));
  }

  function ripple(cellIndex, color) {
    var cell = cells[cellIndex]; if (!cell) return;
    var br = rectOf(el.board);
    var cr = rectOf(cell);
    var d = document.createElement('div');
    d.className = 'ripple';
    d.style.setProperty('--rc', color);
    d.style.left = (cr.left - br.left + cr.width / 2) + 'px';
    d.style.top = (cr.top - br.top + cr.height / 2) + 'px';
    d.style.width = cr.width + 'px';
    d.style.height = cr.width + 'px';
    el.fxLayer.appendChild(d);
    setTimeout(function () { d.remove(); }, ms(1000));
  }

  function glowBoard(cellIndex, color) {
    var br = rectOf(el.board), cr = rectOf(cells[cellIndex]);
    el.boardGlow.style.setProperty('--gc', color);
    el.boardGlow.style.setProperty('--gx', ((cr.left - br.left + cr.width / 2) / br.width * 100) + '%');
    el.boardGlow.style.setProperty('--gy', ((cr.top - br.top + cr.height / 2) / br.height * 100) + '%');
    el.boardGlow.classList.add('on');
    setTimeout(function () { el.boardGlow.classList.remove('on'); }, ms(900));
  }

  function quake() {
    var shell = el.board.parentElement;
    shell.classList.remove('quake'); void shell.offsetWidth; shell.classList.add('quake');
    setTimeout(function () { shell.classList.remove('quake'); }, ms(600));
  }

  function toast(html, cls, chainColor) {
    var d = document.createElement('div');
    d.className = 'toast ' + (cls || '');
    d.innerHTML = html;
    if (chainColor) d.style.setProperty('--c', chainColor);
    el.toasts.appendChild(d);
    setTimeout(function () { d.remove(); }, ms(2600));
  }

  function animateNumber(node, from, to, duration) {
    var start = performance.now();
    var dur = ms(duration || 650);
    function frame(now) {
      var t = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      node.textContent = R.formatMoney(Math.round(from + (to - from) * e));
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ *
   * 盤面の描画
   * ------------------------------------------------------------------ */
  function buildBoard() {
    el.board.innerHTML = '';
    cells = [];
    for (var i = 0; i < R.CELLS; i++) {
      var c = document.createElement('div');
      c.className = 'cell';
      c.setAttribute('role', 'gridcell');
      c.dataset.i = i;
      c.textContent = R.label(i);
      c.addEventListener('click', onCellClick);
      el.board.appendChild(c);
      cells.push(c);
    }
  }

  var ANIM_CLASSES = ['anim-pop', 'anim-paint', 'anim-absorb', 'anim-shine'];

  function paintCell(i, val, anim, delay) {
    var cell = cells[i];
    view[i] = val;
    ANIM_CLASSES.forEach(function (a) { cell.classList.remove(a); });
    cell.className = 'cell';
    cell.style.removeProperty('--c');
    cell.style.removeProperty('--cd');

    if (val === null || val === undefined) {
      cell.textContent = R.label(i);
    } else if (val === '.') {
      cell.classList.add('lone');
      cell.textContent = R.label(i);
    } else {
      var ch = R.chain(val);
      cell.classList.add('chained');
      cell.style.setProperty('--c', ch.color);
      cell.style.setProperty('--cd', ch.dark);
      cell.innerHTML = '<span class="tag">' + ch.abbr + '</span>';
      cell.title = ch.jp + ' ' + R.label(i);
    }

    if (anim) {
      cell.style.setProperty('--d', ms(delay || 0) + 'ms');
      void cell.offsetWidth;
      cell.classList.add(anim);
    }
  }

  /* 一群のタイルを、起点から近い順に順番に塗る */
  function paintGroup(tiles, val, origin, anim, stepMs) {
    var sorted = tiles.slice().sort(function (a, b) {
      return R.distance(a, origin) - R.distance(b, origin);
    });
    var step = stepMs != null ? stepMs : TIMING.paintStep;
    sorted.forEach(function (t, k) {
      paintCell(t, val, anim, k * step);
    });
    return sorted.length * step + 600;
  }

  function syncBoard() {
    for (var i = 0; i < R.CELLS; i++) {
      if (view[i] !== state.board[i]) paintCell(i, state.board[i]);
    }
  }

  function decorateBoard() {
    var sz = Engine.sizes(state);
    var human = Engine.actor(state);
    var playable = {};
    if (state.phase === 'place' && human.isHuman) {
      human.tiles.forEach(function (t) {
        if (Engine.isPlayable(state, t)) playable[t] = true;
      });
    }
    for (var i = 0; i < R.CELLS; i++) {
      var cell = cells[i];
      var v = state.board[i];
      cell.classList.toggle('safe-mark', !!(v && v !== '.' && sz[v] >= R.SAFE_SIZE));
      cell.classList.toggle('playable', !!playable[i]);
      cell.classList.toggle('target', selectedTile === i);
    }
  }

  /* ------------------------------------------------------------------ *
   * 手札
   * ------------------------------------------------------------------ */
  function kindOf(tile) {
    var a = Engine.analyze(state, tile);
    switch (a.type) {
      case 'found':   return { text: '設立', color: '#e9c46a' };
      case 'merge':   return { text: '合併', color: '#ff6fb5' };
      case 'grow':    return { text: R.chain(a.chain).jp, color: R.chain(a.chain).color };
      case 'dead':    return { text: '配置不可', color: '#94a3b8' };
      case 'blocked': return { text: '設立不可', color: '#94a3b8' };
      default:        return null;
    }
  }

  function renderHand() {
    var human = state.players.find(function (p) { return p.isHuman; });
    var owner = human || state.players[state.current];
    var isTurn = human ? (state.current === human.idx && state.phase === 'place') : false;

    el.handOwner.textContent = human ? 'あなたの手札' : (owner.name + ' の手札（観戦）');

    var sig = owner.idx + ':' + owner.tiles.join(',') + ':' + isTurn;
    var changed = sig !== handSignature;
    handSignature = sig;

    el.hand.innerHTML = '';
    el.hand.classList.toggle('locked', !isTurn);

    owner.tiles.forEach(function (t, i) {
      var b = document.createElement('button');
      b.className = 'tile';
      b.textContent = R.label(t);
      b.dataset.tile = t;
      if (changed) b.style.setProperty('--d', ms(i * 55) + 'ms');
      else b.style.animation = 'none';

      var a = Engine.analyze(state, t);
      if (a.type === 'dead') b.classList.add('dead');
      else if (a.type === 'blocked') b.classList.add('blocked');

      if (isTurn) {
        var k = kindOf(t);
        if (k) {
          var tag = document.createElement('span');
          tag.className = 'kind';
          tag.textContent = k.text;
          tag.style.setProperty('--kc', k.color);
          b.appendChild(tag);
        }
        b.disabled = (a.type === 'dead' || a.type === 'blocked');
        if (selectedTile === t) b.classList.add('selected');
        b.addEventListener('click', function () { onHandClick(t); });
      } else {
        b.disabled = true;
      }
      el.hand.appendChild(b);
    });

    if (!owner.tiles.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'color:var(--text-faint);font-size:12px;padding:16px 4px;';
      empty.textContent = 'タイルはありません（山札切れ）';
      el.hand.appendChild(empty);
    }

    var actingIsHuman = human && Engine.actor(state).idx === human.idx;
    if (!human) el.handHint.textContent = 'CPU同士の対戦を観戦しています';
    else if (state.phase === 'gameover') el.handHint.textContent = 'ゲーム終了';
    else if (isTurn) el.handHint.textContent = selectedTile != null
      ? R.label(selectedTile) + ' を盤面に置きます'
      : 'タイルを選んで配置してください';
    else if (actingIsHuman) el.handHint.textContent = '下の操作パネルで ' +
      (PHASE_TEXT[state.phase] || '') + ' を行ってください';
    else el.handHint.textContent = '他のプレイヤーの手番です';
  }

  /* ------------------------------------------------------------------ *
   * プレイヤーパネル
   * ------------------------------------------------------------------ */
  function renderPlayers() {
    var actor = Engine.actor(state);
    var sz = Engine.sizes(state);

    state.players.forEach(function (p) {
      var card = el.players.querySelector('[data-p="' + p.idx + '"]');
      if (!card) {
        card = document.createElement('div');
        card.className = 'pcard';
        card.dataset.p = p.idx;
        card.innerHTML =
          '<div class="pcard-head">' +
            '<div class="pavatar"></div>' +
            '<div class="pname"></div>' +
            '<div class="pbadge"></div>' +
          '</div>' +
          '<div class="pcash-row"><div class="pcash"></div><div class="pworth"></div></div>' +
          '<div class="pshares"></div>';
        card.style.setProperty('--pc', PLAYER_COLORS[p.idx % PLAYER_COLORS.length]);
        el.players.appendChild(card);
      }

      card.querySelector('.pavatar').textContent = p.name.slice(0, 1);
      card.querySelector('.pname').textContent = p.name;
      card.querySelector('.pbadge').textContent = p.isHuman
        ? 'YOU'
        : (AI.PERSONA[p.personality] || AI.PERSONA.balanced).label;

      var cashNode = card.querySelector('.pcash');
      var before = prevCash[p.idx];
      if (before == null) cashNode.textContent = R.formatMoney(p.cash);
      else if (before !== p.cash) animateNumber(cashNode, before, p.cash);
      prevCash[p.idx] = p.cash;

      var worth = Engine.netWorth(state, p);
      card.querySelector('.pworth').textContent = '資産 ' + R.formatMoney(worth);

      card.classList.toggle('active', p.idx === state.current && state.phase !== 'gameover');
      card.classList.toggle('acting', p.idx === actor.idx && state.phase !== 'gameover');

      /* 株チップ */
      var box = card.querySelector('.pshares');
      var prev = prevShares[p.idx] || {};
      box.innerHTML = '';
      R.CHAIN_IDS.forEach(function (id) {
        var n = p.shares[id];
        if (n <= 0) return;
        var ch = R.chain(id);
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.style.setProperty('--c', ch.color);
        chip.innerHTML = ch.abbr + ' <span class="n">' + n + '</span>';
        if (sz[id] > 0 && Engine.standing(state, id, p.idx) === 'majority') chip.classList.add('crown');
        if ((prev[id] || 0) !== n) chip.classList.add('new');
        box.appendChild(chip);
      });
      prevShares[p.idx] = Object.assign({}, p.shares);
    });
  }

  function playerCardOf(idx) { return el.players.querySelector('[data-p="' + idx + '"]'); }
