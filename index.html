<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACQUIRE — ホテルチェーン買収ゲーム</title>
<link rel="stylesheet" href="css/styles.css">

<!-- ── アクセス解析 ───────────────────────────────────────────────
     PLAYBENCH（https://shunshun0904.github.io/playbench/）と同じ測定ID。
     どのゲームが遊ばれているかを、1つのプロパティでパスごとに見るため。

     ここがこのファイル唯一の外部読み込みで、行き先は
     https://www.googletagmanager.com/gtag/js だけ。ゲーム本体は
     いままで通り何も読み込まない。

     読み込まない条件が3つある。
       1. file:// で開いたとき ── 1枚で配れる作りを壊さないため
       2. ブラウザが追跡拒否を出しているとき（GPC / DNT）
       3. localStorage の pb-analytics が off のとき
          6サイトとも同一オリジンなので、PLAYBENCH の奥付で「止める」を
          押せば、このゲームでも止まる
     ────────────────────────────────────────────────────────── -->
<script>
(function () {
  var ID = 'G-L76Z1LVWX6';
  if (!/^https?:$/.test(location.protocol)) return;

  var say = null;
  try { say = localStorage.getItem('pb-analytics'); } catch (e) {}
  if (say === 'off') return;
  if (say !== 'on') {
    var d = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
    if (navigator.globalPrivacyControl || d === '1' || d === 'yes') return;
  }

  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', ID);

  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
  document.head.appendChild(s);
})();
</script>

</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div class="brand-text">
        <h1>ACQUIRE</h1>
        <p>ホテルチェーン買収ゲーム</p>
      </div>
    </div>

    <div class="status" id="status">
      <div class="status-turn" id="statusTurn">—</div>
      <div class="status-phase" id="statusPhase">準備中</div>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="btnRules" title="ルール">?</button>
      <button class="icon-btn" id="btnSound" title="サウンド" aria-pressed="true">♪</button>
      <button class="btn btn-ghost" id="btnNew">新しいゲーム</button>
    </div>
  </header>

  <main class="layout">

    <section class="board-col">
      <div class="board-shell">
        <div class="board-glow" id="boardGlow"></div>
        <div class="board" id="board" role="grid" aria-label="ゲームボード"></div>
        <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
      </div>

      <div class="hand-shell">
        <div class="hand-head">
          <span class="hand-title" id="handOwner">あなたの手札</span>
          <span class="hand-hint" id="handHint">タイルを選んで配置してください</span>
        </div>
        <div class="hand" id="hand"></div>
      </div>

      <div class="action-bar" id="actionBar"></div>
    </section>

    <aside class="side-col">
      <div class="panel players-panel">
        <h2 class="panel-title">プレイヤー</h2>
        <div class="players" id="players"></div>
      </div>

      <div class="panel">
        <h2 class="panel-title">ホテルチェーン</h2>
        <div class="chain-table" id="chains"></div>
      </div>

      <div class="panel log-panel">
        <h2 class="panel-title">ログ</h2>
        <div class="log" id="log"></div>
      </div>
    </aside>

  </main>
</div>

<div class="overlay" id="overlay" hidden></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
<div class="toast-stack" id="toasts" aria-live="polite"></div>

<script src="js/rules.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
